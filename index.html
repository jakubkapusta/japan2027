### JEDZENIE
Automaty (jihanki) :: Pocari Sweat / Aquarius | Izotoniki — ratunek w upale (Tokio w sierpniu: 35°C + wilgotność!). Pocari Sweat (Otsuka, 1980) to japońska odpowiedź na Gatorade: lekko słony, cytrusowy, orzeźwiający. Nazwa „Sweat" brzmi dziwnie po angielsku, ale w Japonii kojarzy się ze sportem i zdrowym potem. Aquarius (Coca-Cola Japan) jest lżejszy. Oba w każdym automacie za ~160 ¥. Pijcie 1–2 dziennie — naprawdę ratują w upale. W Japonii jest ~5 milionów automatów z napojami — jeden na ~23 osoby, najwyższa gęstość na świecie.
Automaty (jihanki) :: Kawa w puszce (BOSS, Georgia) | Japonia wymyśliła kawę w puszce w 1969 (UCC). Marka BOSS (Suntory) ma twarz Humphreya Bogarta i jest kultowa — Tommy Lee Jones nagrał ponad 80 reklam BOSS jako kosmita badający japońską kulturę pracy. Georgia (Coca-Cola) to najpopularniejsza. Ten sam automat podaje gorące (czerwona etykieta) i zimne (niebieska) puszki obok siebie — dwie temperatury z jednej maszyny. Black (bez cukru), Latte, Café au Lait — pijecie to na ulicy o 7 rano i czujecie się jak salaryman. ~130 ¥.
Automaty (jihanki) :: Oi Ocha / Iyemon | Zielona herbata bez cukru — to DOMYŚLNY napój Japonii (nie woda, nie cola). Oi Ocha (Itoen, „hej, herbato!") i Iyemon (Suntory, nazwany od słynnego producenta herbaty z Uji z XVIII w.) smakują jak świeżo zaparzona sencha — gorzkawo, roślinnie, orzeźwiająco. UWAGA na etykiety: zielona = niesłodzona (to ta), brązowa = hōjicha (prażona, też dobra), ale niektóre mają drobny napis „sweetened" — sprawdźcie. Japończycy piją ją do wszystkiego — do sushi, do bentu, do onigiri. Po tygodniu wy też będziecie.
Automaty (jihanki) :: Calpico (Calpis) | Mleczno-cytrusowy napój gazowany o lekko jogurtowym posmaku — smak trudny do opisania, ale natychmiast uzależniający. Wymyślony w 1919 po podróży założyciela Kaiun Mishimy do Mongolii, gdzie pił kumys (fermentowane mleko klaczy). Nazwa „Calpis" (Cal od calcium + pis od sanskryckiego sarpis = masło) brzmi niefortunnie po angielsku, stąd eksportowa nazwa „Calpico". W automacie szukajcie niebiesko-białej puszki z kropkami. Istnieje wersja z wodą i z sodą — soda jest lepsza w upale.
Automaty (jihanki) :: Gogo no Kōcha | „Popołudniowa herbata" (午後の紅茶) od Kirin — słodka herbata z mlekiem (royal milk tea) w plastikowej butelce. Japonia jest jednym z największych konsumentów herbaty mlecznej w Azji Wschodniej. Gogo no Kōcha istnieje od 1986 i jest w KAŻDYM automacie. Trzy warianty: straight (bez mleka, niesłodka), lemon tea, milk tea (ta najpopularniejsza — złota etykieta). Zimna milk tea w upalne popołudnie to błogość. Alternatywa: Lipton Royal Milk Tea w puszce — gęstsza i bardziej kremowa.
Automaty (jihanki) :: Ramune | Napój gazowany w butelce zamkniętej szklaną kulką (biidama) zamiast kapsla — wciskacie plastikowy popychacz, kulka wpada do szyjki i napój syczy. Dzieci to uwielbiają! Wynaleziony w 1884 w Kobe przez Szkota Alexandra Camerona Sima — wzorowany na brytyjskim Codd-neck bottle. Smak: cytrynowo-limonkowy, intensywnie gazowany, lekko sztuczny — ale chodzi o doświadczenie, nie smak. Klasyk japońskich festiwali (matsuri) i letnich wspomnień. Kupcie na stoisku yatai — smakuje lepiej z plastikiem pod stopami.
Automaty (jihanki) :: C.C. Lemon | Musujący napój cytrynowy od Suntory, reklamowany jako „70 cytryn w jednej butelce" (chodzi o witaminę C, nie sok). Jasnożółty, słodki, bardzo gazowany — jak lemonada na sterydach. W Japonii od 1994, stał się klasykiem automatów. Żółta puszka/butelka z rysunkową cytryną — nie da się pomylić. Alternatywa na upał gdy Pocari jest za „sportowy" a herbata za gorzka. Michał prawdopodobnie będzie go pił codziennie.
Konbini :: Onigiri | Trójkątny klocek ryżu z nadzieniem, owinięty nori (wodorosty). Genialna inżynieria opakowania: plastikowy rozdzielacz trzyma nori osobno od ryżu, żeby nie zmiękło — ciągniesz pasek i nori owija się wokół ryżu dopiero przy jedzeniu. Najpopularniejsze smaki: tuna-mayo (klasyk), ume (kwaśna śliwka — różowy), shake (łosoś — pomarańczowy), mentaiko (pikantna ikra dorsza). Kosztuje ~120–180 ¥ i jest posiłkiem samym w sobie. Japończycy jedzą ~5,8 miliarda onigiri rocznie. Śniadanie nr 1 w podróży.
Konbini :: Tamago sando | Kanapka z jajkiem — pozornie nic specjalnego, ale japońska wersja to objawienie. 7-Eleven robi najlepszą: puszyste, kremowe jajko (mix sałatki jajecznej i omletowej warstwy) między dwoma plasterkami miękkiego białego chleba bez skórki (shokupan). Sekret: japoński majonez Kewpie (tylko żółtka, ryżowy ocet) i idealnie ugotowane jajka. Kosztuje ~200 ¥ i jest jednym z powodów, dla których japońskie konbini są legendarne. Lawson ma wersję z grubym omletem — też rewelacja.
Konbini :: Katsu sando | Kanapka z panierowanym kotletem wieprzowym (tonkatsu), sosem i czasem musztardą, w miękkim shokupan. Bardziej sycąca niż tamago sando — to jest lunch. Konbini-wersja jest dobra, ale najlepsza jest z butikowej kanapkarni (np. Maisen w Tokio). Panko (japońska bułka tarta) daje inną chrupkość niż europejska panierka — płatki są większe i bardziej powietrzne. Katsu sando stało się globalnym trendem gastronomicznym ok. 2018, ale w Japonii jedzą je od dekad.
Konbini :: Karaage-kun / FamiChiki | Smażony kurczak kupowany przy kasie — gorący, chrupiący, gotowy w sekundę. Karaage-kun (Lawson, od 1986) to małe bryłki w kilku smakach (regular, cheese, lemon). FamiChiki (FamilyMart) to większy kawałek, bardziej soczysty. Obie sieci traktują smażonego kurczaka poważniej niż niejedna restauracja. Jedzone w biegu na ulicy — idealne gdy głód atakuje między posiłkami. Za ~200 ¥ dostajesz coś, co w KFC kosztowałoby trzy razy tyle i byłoby gorsze.
Konbini :: Lody i mochi-ice | Japońska zamrażarka konbini to osobna atrakcja. Häagen-Dazs ma tu ekskluzywne smaki (matcha, hojicha, sakura, sweet potato) niedostępne nigdzie indziej na świecie. Yukimi Daifuku to lód waniliowy owinięty w cienko rozwałkowane mochi (kleisty ryż) — miękkie, ciągnące się, genialne. Jest też „ice no mi" (mrożone kuleczki soku), popsicle azuki i lody z konbini-ekspresu. W sierpniowym upale będziecie jedli lody 2× dziennie — i nikt was nie osądzi.
Konbini :: Zimne makarony latem | W letnim upale Japończycy przerzucają się na zimne makarony — konbini ma je gotowe. Hiyashi chūka: zimne ramen z warzywami, omletem i sosem sezamowym lub octowym — kolorowe i orzeźwiające. Zaru soba: gryczane noodle na bambusowej macie z zimnym tsuyu do maczania. Reimen (zimny ramen koreański): pikantny, z gumowymi noodle. Wszystkie za ~400–500 ¥, syciące i chłodzące. Sierpień w Japonii bez zimnych noodle to jak lato bez lodów.
Konbini :: Desery premium | Japońskie konbini mają osobną lodówkę z deserami, które wyglądają jak z cukierni. Warabimochi (przezroczyste galaretowate klocki z paprociowej skrobi, posypane kinako — prażoną mąką sojową): trzęsące się na łyżce, lekko słodkie, letni klasyk. Purin (japoński pudding — gęstszy i bardziej karmelowy niż europejski crème caramel). Sufle-naleśniki (puszysty naleśnik z bitą śmietaną). Lawson robi najlepsze desery (seria „Uchi Café"), 7-Eleven ma najlepszy purin. ~200–400 ¥ za deser lepszy niż w połowie europejskich restauracji.
Konbini :: Kawa z ekspresu | Świeżo mielona, parzona na miejscu za ~120 ¥ (mała) — lepsza niż myślisz i lepsza niż wiele kawiarni. 7-Eleven (Seven Café, od 2013) zrewolucjonizowało rynek: automat z prawdziwymi ziarnami arabiki przy kasie. Wkładacie kubek, wciskacie guzik, kawa mieli się i parzy na waszych oczach. Hot i iced. Lawson ma „MACHI café" (barista robi), FamilyMart ma „Famima Café". Łącznie japońskie konbini sprzedają ponad miliard kaw rocznie — to najbardziej niedoceniany system kawowy na świecie.
Sieci — miski ryżu (gyūdon/curry) :: Yoshinoya · 吉野家 | Gyūdon (miska ryżu z duszoną wołowiną i cebulą w słodko-słonym sosie) — król taniego jedzenia od 1899, gdy pierwszy bar otwarto przy targu rybnym w Tokio. Pomarańczowy szyld widać wszędzie. Zamawiacie rozmiar (nami / ō-mori), dokładacie surowe jajko (tamago) do rozbicia na gorącym ryżu, marynowany imbir beni-shōga gratis na ladzie. Miska ~500 ¥, na stół w minutę. Często otwarte 24h — ratunek po nocnym powrocie (np. z Daikoku). Motto: „hayai, yasui, umai" — szybko, tanio, smacznie. | 吉野家
Sieci — miski ryżu (gyūdon/curry) :: Sukiya · すき家 | Największa sieć gyūdon w Japonii (więcej lokali niż Yoshinoya). Menu szersze niż u konkurencji: gyūdon z serem, kimchi, startym yamaimo, curry, śniadaniowe zestawy z rybą i miso. Rodzinnie przyjazna — są normalne stoliki, nie tylko lada, więc łatwo wejść z Michałem. Miska od ~450 ¥, zamówienie przy stoliku lub w automacie. Dobra opcja gdy jedno chce wołowinę, drugie curry, a trzecie coś lekkiego — wszystko w jednym miejscu. | すき家
Sieci — miski ryżu (gyūdon/curry) :: Matsuya · 松屋 | Trzeci wielki gracz gyūdon, rozpoznawalny po żółto-niebieskim szyldzie. Zamawiacie w automacie biletowym przy wejściu (dobry trening przed resztą podróży!), a do każdego dania dostajecie darmową miskę zupy miso. Specjalności poza gyūdon: „gyū-meshi", gęste pikantne curry i zestawy z grillowanym mięsem (yakiniku teishoku). Tanio (~450–800 ¥), szybko i mniej turystycznie niż Yoshinoya. | 松屋
Sieci — miski ryżu (gyūdon/curry) :: CoCo Ichibanya · CoCo壱番屋 | Największa sieć curry na świecie („CoCo Ichi", od 1978). Sami składacie danie: ilość ryżu (podawana w gramach!), poziom ostrości (0 do 10 — nowicjusz zaczyna od 2–3) i dodatki: katsu wieprzowy, panierowane krewetki, ser, jajko, warzywa, natto. Japońskie curry jest łagodne, gęste i słodkawe — dla dzieci idealne na poziomie 0–1. Menu z obrazkami i po angielsku. ~800–1300 ¥ z dodatkami. Pewny strzał, gdy nikt nie wie, na co ma ochotę. | CoCo壱番屋
Sieci — sushi taśmowe (kaiten) :: Sushiro · スシロー | Numer 1 wśród kaiten-zushi (sushi na taśmie) w Japonii. Talerzyk od ~120 ¥ — jakość zawstydzająco dobra jak na tę cenę. Zamawiacie na tablecie (jest angielski), a wasze talerzyki jadą osobnym „ekspresowym" torem prosto do stolika, nad zwykłą taśmą. Kolory talerzy = różne ceny, liczycie je na koniec. W szczycie weźcie numerek w apce z wyprzedzeniem — kolejki bywają długie. Prawdopodobnie najlepszy stosunek jakości do ceny w całej podróży. | スシロー
Sieci — sushi taśmowe (kaiten) :: Kura Sushi · くら寿司 | Kaiten-zushi z atrakcją dla dzieci: zjedzone talerzyki wrzucacie do szczeliny w stole, a co 5 sztuk uruchamia „Bikkura Pon" — automat losuje na ekranie nad stołem kapsułę z gadżetem (anime, figurki). Michał pokocha. Sieć chwali się brakiem sztucznych dodatków i konserwantów, talerze jadą pod higienicznymi kopułkami. Ceny jak u Sushiro (~120 ¥/talerz), zamawianie na tablecie. Sushi + gra + nagroda = idealny obiad z dzieckiem. Bez rezerwacji, ale w weekend i w Obon pobierzcie numerek w apce Kura z wyprzedzeniem — kolejki bywają długie. | くら寿司
Sieci — sushi taśmowe (kaiten) :: Hama Sushi · はま寿司 | Najtańsza z wielkich sieci taśmowych (grupa Zensho, ta sama co Sukiya). Talerzyki od ~100 ¥, w dni powszednie bywają promocje jeszcze taniej. Na stole kilka rodzajów sosu sojowego (m.in. słodki z Kyūshū) i tablet do zamawiania. Mniej fajerwerków niż Kura, ale portfel odczuje różnicę. Dobre, gdy chcecie po prostu najeść się sushi bez zerkania na rachunek. Bez rezerwacji, ale w szczycie warto pobrać numerek w apce sieci, żeby nie stać pod drzwiami. | はま寿司
Sieci — ramen i udon :: Ippudo · 一風堂 | Sieć ramenu z Hakaty (Fukuoka), założona 1985 — jeden z pionierów, który wyniósł tonkotsu (kremowy wieprzowy bulion) na świat (dziś są w Nowym Jorku i Londynie). Klasyki: delikatny „Shiromaru" i pikantniejszy „Akamaru". Cienki, prosty makaron hakata — do resztki bulionu możecie dobrać samą dokładkę makaronu (kae-dama). Bardziej „restauracyjne" i wygodne niż ciasne kabiny Ichiran (patrz sekcja Tokio). ~1000–1400 ¥. | 一風堂
Sieci — ramen i udon :: Tenkaippin · 天下一品 | Kultowa sieć ramenu z Kioto (od 1971!). Słynie z bulionu „kotteri": tak gęstego od kurczaka i warzyw, że przypomina bardziej sos niż zupę i oblepia makaron. Dla odważnych; kto woli klasykę, zamawia „assari" (lekki). Fani mówią wprost o „uzależnieniu od Tenka". Szukajcie żółtego szyldu 天下一品 — w Kioto traficie na nie łatwo, to lokalny rytuał zamiast turystycznej ramenowni. ~900 ¥. | 天下一品
Sieci — ramen i udon :: Marugame Seimen · 丸亀製麺 | Sieć udonu w stylu sanuki — makaron ugniatany i cięty na miejscu, gotowany na waszych oczach. Idziecie wzdłuż lady jak w stołówce: wybieracie miskę (kake, bukkake, kamatama), dokładacie z bufetu tempurę (chrupiące krewetki, warzywa, kurczak) i onigiri, płacicie na końcu. Makaron gruby, sprężysty, świeżutki. Absurdalnie tanio: podstawowa miska ~350–400 ¥, z tempurą wychodzicie za ~700 ¥. Szybkie, sycące, świetne dla dzieci. | 丸亀製麺
Sieci — teishoku i katsu :: Ōtoya · 大戸屋 | Sieć teishoku (zestaw: danie główne + ryż + zupa miso + pikle) w stylu domowej kuchni japońskiej, gotowane na zamówienie, nie z podgrzewacza. Zdrowo i „jak u mamy": grillowana ryba (hokke), kurczak nanban, smażone tofu, dużo warzyw. Menu z obrazkami. Idealne, gdy macie dość street foodu i chcecie porządny, zbilansowany posiłek. ~900–1300 ¥. Często na piętrze — szukajcie szyldu 大戸屋 i schodów w górę. | 大戸屋
Sieci — teishoku i katsu :: Yayoiken · やよい軒 | Teishoku z haczykiem, który pokochacie: ryż do woli (okawari) z automatu przy sali — dokładacie ile chcecie, gratis. Zamówienie w automacie biletowym. Klasyki: grillowana ryba, shōga-yaki (wieprzowina w imbirze), zestawy z kotletem. Tanio (~700–950 ¥) i sycąco. Wymarzone dla wygłodniałego nastolatka, który dosypie sobie trzy miski ryżu. | やよい軒
Sieci — teishoku i katsu :: Katsuya · かつや | Specjaliści od tonkatsu (panierowany kotlet wieprzowy) w wersji budżetowej. Katsu-don (kotlet z jajkiem na ryżu) albo zestaw z kapustą i ryżem za ~600–850 ¥ — ułamek ceny „porządnej" tonkatsu-ya, a najedzenie gwarantowane. Chrupiące panko, gęsty sos tonkatsu do polania. Dobre na szybki, treściwy lunch bez rezerwacji i ceremonii. | かつや
Sieci — teishoku i katsu :: Tenya · てんや | Tendon (tempura na misce ryżu polana słodkim sosem) w cenie street foodu. Sieć zdemokratyzowała tempurę, która potrafi być droga — podstawowy tendon z krewetką i warzywami ~600 ¥. Świeżo smażone, sos tentsuyu wsiąka w ryż. Szybko i pysznie; dobra bramka do świata tempury, zanim (albo zamiast) wydacie krocie w specjalistycznej tempura-ya. | 天丼てんや
Sieci — restauracje rodzinne (famiresu) :: Gusto · ガスト | Najtańszy i najczęściej spotykany famiresu w Japonii (grupa Skylark). Zamawiacie na tablecie (jest angielski), a jedzenie często przywozi... kot-robot „Bella-chan" — sunie między stolikami z tacą, dzieci szaleją (Michał!). Drink bar za ~250 ¥ = nielimitowane napoje, soki, kawa z automatu. Menu-worek: hamburg (stek mielony), makarony, ryże, frytki, zestawy dziecięce, parfait. Otwarte do późna, tanio (~700–1200 ¥). Idealne, gdy trzeba szybko, tanio i bez stresu nakarmić głodną rodzinę. | ガスト
Sieci — restauracje rodzinne (famiresu) :: Royal Host · ロイヤルホスト | Famiresu z wyższej półki (od 1971) — bez automatów i taniochy, za to obsługa kelnerska i realnie dobra kuchnia. Sztandarowe: curry duszone godzinami (kultowe wśród Japończyków), stek hamburgowy, zupa cebulowa gratin, sezonowe „fair" (co kilka tygodni inne menu — latem np. mango, brzoskwinie). Drożej niż Gusto (~1500–2500 ¥/os.), ale to cicha, komfortowa sala z klimatyzacją i pełne menu z obrazkami. Dobre na spokojniejszą, „porządną" kolację całą trójką. | ロイヤルホスト
Sieci — restauracje rodzinne (famiresu) :: Saizeriya · サイゼリヤ | Włoski famiresu o cenach nie z tej epoki — Milano doria (zapiekanka ryżowa) ~300 ¥, do tego makarony, pizza, sałatki, wszystko tanio. Ratunek dla zmęczonej rodziny: ogromne menu z obrazkami, drink bar (nielimitowane napoje), wygodne stoliki, klimatyzacja, dzieci mile widziane. Nie haute cuisine, ale najedzenie całej trójki za grosze i chwila oddechu od japońszczyzny. Idealne na „nie mamy siły dziś szukać". | サイゼリヤ
Sieci — restauracje rodzinne (famiresu) :: Denny's · デニーズ | Japońska wersja Denny's (należy do Seven & i — nie mylcie z amerykańskim oryginałem, menu jest zupełnie inne). Klimat amerykańskiego diner-a w japońskim wykonaniu: hamburg, omlety, naleśniki, gigantyczne parfait i desery, śniadania serwowane cały dzień. Drink bar, menu z obrazkami, otwarte długo. Trochę droższe od Gusto, przyjemniejsze wnętrze. Dobre na słodkie parfait po zwiedzaniu albo leniwe „amerykańskie" śniadanie. | デニーズ
Sieci — restauracje rodzinne (famiresu) :: Bamiyan · バーミヤン | Chiński famiresu grupy Skylark — chińszczyzna w wersji tanio-i-obficie. Gyoza (pierożki), ramen, mapo tofu, smażony ryż, karaage — porcje do dzielenia w stylu rodzinnym, na wspólny stół. Ceny jak w Gusto (dania od ~400–700 ¥), drink bar, tablet do zamawiania. Świetne, gdy macie dość japońskiej klasyki i chcecie coś bardziej wyrazistego i ostrego. | バーミヤン
Sieci — kawiarnie i wieczór :: Komeda Coffee · コメダ珈琲店 | Kawiarnia w stylu „kissaten" z Nagoi (od 1968) — oaza w środku zwiedzania. Sztandarowy patent: „morning service" — do kawy zamówionej rano dostajecie GRATIS tost z masłem i jajko. Legendarny deser „Shironoir": ciepła duńska bułka z zimnym lodem softem na wierzchu. Drewniane boksy, można długo posiedzieć w klimatyzacji podczas upału. Porcje hojne. Kawa ~500 ¥. Idealna przerwa dla nóg w połowie dnia. | コメダ珈琲店
Sieci — kawiarnie i wieczór :: Mister Donut · ミスタードーナツ | „Misudo" — dominująca i kultowa sieć pączków w Japonii. Gwiazda menu: „Pon de Ring" — pączek z połączonych kuleczek o ciągnącej, mochi-podobnej konsystencji (zupełnie inny niż europejski). Tanio, mnóstwo smaków, sezonowe edycje. Można usiąść i napić się kawy z dolewką. Słodki przystanek, który dzieci uwielbiają. Pączek ~150 ¥. | ミスタードーナツ
Sieci — kawiarnie i wieczór :: Torikizoku · 鳥貴族 | Sieć izakaya (japoński pub z jedzeniem) z Osaki, gdzie niemal wszystko — szpadki yakitori, przekąski, część drinków — kosztuje jedną, równą cenę (ok. 370 ¥). Wieczorny klimat: zamawiacie dużo małych rzeczy do dzielenia, piwo lub napój, i płacicie mało. Świetne na luźną kolację w grupie, zamówienia z tabletu. Dla nastolatka opcje bezalkoholowe, dla dorosłych nama biru (lane piwo). Jedyna z tych sieci, gdzie w piątek/sobotę wieczorem lub w Obon warto zarezerwować stolik (telefon/apka) — wieczorami bywa pełno. | 鳥貴族

.res-detb{font-size:.82em;color:var(--muted);line-height:1.55;margin-top:8px}
.res-done{opacity:.55}
.res-done .res-title{text-decoration:line-through}
.res-date{flex:1}
.res-left{flex:none;font-size:.68em;font-weight:700;padding:1px 8px;border-radius:2px;border:1px solid var(--border);background:none;color:#8a8175;white-space:nowrap}
.res-left.cd-soon{border-color:#d8c791;color:#9a7a25}
.res-left.cd-past{border-color:#e3ddd2;color:#b0a89c}
.res-left.dl-done{border-color:#9ecdbd;color:#115c4a}
.res-evt .res-dot{background:var(--bg);box-shadow:inset 0 0 0 2px var(--rtc,#bbb),0 0 0 3px var(--bg)}
.res-evt .res-card{background:#fbf7ee}
/* Pakowanie / Jedzenie — karty grup */
.ck-top{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
.ck-bar{flex:1;height:8px;border-radius:2px;background:#e9e1d2;overflow:hidden}
.ck-bar-f{height:100%;background:var(--teal);border-radius:2px;transition:width .25s}
.ck-top-l{font-size:.8em;font-weight:700;color:var(--muted);white-space:nowrap}
.ck-card{background:var(--card);border:1px solid var(--border);border-radius:2px;margin-bottom:6px;overflow:hidden}
.ck-gh{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #f1ebde}
.ck-ic{font-size:1.2em;line-height:1}
.ck-gt{flex:1;font-family:var(--font-serif);font-weight:700;font-size:.98em;color:var(--text)}
.ck-gc{font-size:.72em;font-weight:700;color:var(--muted);background:#f2ece0;border-radius:20px;padding:2px 10px}
.ck-items{padding:6px 8px 8px}
.ck-row{display:flex;align-items:flex-start;gap:10px;padding:7px 9px;border-radius:0;cursor:pointer;transition:background .12s}
.ck-row:hover{background:#faf6ee}
.ck-cb{flex:0 0 auto;width:20px;height:20px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;margin-top:1px;transition:.15s}
.ck-on .ck-cb{background:var(--teal);border-color:var(--teal)}
.ck-tx{font-size:.9em;line-height:1.45;padding-top:1px;flex:1;min-width:0}
.shop-wh .mchip{white-space:normal}
.ck-tx b{font-weight:700}
.ck-on .ck-tx{text-decoration:line-through;opacity:.5}
.ck-d{color:var(--muted);font-weight:400}
.ck-grp{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.ck-grp:first-of-type{margin-top:4px}
.ck-mon{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--pc,var(--kin));display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;font-size:1.15em;color:var(--pc,var(--kin));flex:none;line-height:1}
.ck-mon.ck-mon-k2{font-size:.92em;letter-spacing:-.01em}
.ck-gt2{flex:1;font-family:var(--font-serif);font-weight:700;font-size:1.12em;color:var(--text)}
.ck-gc2{font-size:.74em;font-weight:700;color:var(--muted);background:none;border-radius:0;padding:0}
.p-gold{--pc:var(--kin)}
/* Mapa trasy (Plan) */
.route-map{background:var(--card);border:1px solid var(--border);border-radius:2px;padding:14px 16px 12px;margin-bottom:14px}
.rm-title{font-family:var(--font-serif);font-weight:700;font-size:1.05em;color:var(--text);margin-bottom:4px}
.rm-title span{font-family:var(--font-jp);font-size:.66em;color:var(--kin);letter-spacing:.22em;margin-left:7px}
.rm-legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:.74em;color:var(--muted);margin-top:6px}
.rm-legend span{display:inline-flex;align-items:center;gap:5px}
.rm-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* Budżet */
.stat-sub{font-size:.68em;color:var(--muted);margin-top:2px}
.bud-note{font-size:.78em;color:var(--muted);line-height:1.45}
.bud-total b{color:var(--p1)}
.bud-conv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:2px;padding:12px 16px;margin-bottom:16px}
.bud-conv-l{font-weight:700;font-size:.9em}
.bud-conv input{width:120px;padding:7px 11px;border:1px solid var(--border);border-radius:2px;font-size:1em;font-family:var(--font);background:var(--card);color:var(--text);text-align:right}
.bud-conv input:focus{outline:none;border-color:var(--indigo)}
.bud-conv-eq{color:var(--muted)}
.bud-conv-out{font-family:var(--font-serif);font-weight:700;font-size:1.18em;color:var(--p1)}
/* Sub-tabs (Zakupy: Co kupić / Budżet) */
.subtabs{display:flex;border:1px solid var(--border);border-radius:2px;overflow:hidden;background:var(--card);margin-bottom:20px}
.subtab{flex:1;text-align:center;padding:9px 8px;font-family:var(--font);font-weight:700;font-size:.86em;border:none;border-left:1px solid var(--border);border-radius:0;cursor:pointer;color:var(--muted);background:none;transition:.15s;user-select:none}
.subtab:first-child{border-left:none}
.subtab.on{background:var(--p1);color:var(--card)}
.subtab:hover:not(.on){color:var(--text);background:var(--bg)}
.subpane{display:none}
.subpane.on{display:block}
.shop-wh{display:block;margin-top:7px}
.shop-wh.plain{font-size:.88em;color:var(--muted);margin-top:3px}
.ck-on .shop-wh{color:var(--muted)}
.ck-on .shop-wh .mchip{color:var(--muted);border-color:var(--border);background:none}
.shop-own{display:inline-block;font-size:.62em;font-weight:700;color:var(--kin);border:1px solid var(--kin);border-radius:2px;padding:1px 7px;margin-left:7px;vertical-align:middle;text-transform:uppercase;letter-spacing:.05em}
.shop-del{flex:0 0 auto;align-self:center;width:24px;height:24px;border:none;border-radius:2px;background:none;color:#b9b0a3;font-size:19px;line-height:1;cursor:pointer;transition:.15s}
.shop-del:hover{background:#f3d9d3;color:var(--red)}
.shop-add{padding:10px 16px;border-top:1px solid var(--border)}
.shop-add-btn{width:100%;padding:9px;border:1.5px dashed var(--border);border-radius:2px;background:none;color:var(--muted);font-family:var(--font);font-weight:700;font-size:.84em;cursor:pointer;transition:.15s}
.shop-add-btn:hover{border-color:var(--p2);color:var(--p2);background:#f6fbf9}
.shop-add-form{display:flex;flex-direction:column;gap:7px}
.shop-add-form[hidden]{display:none}
.shop-add-in{padding:9px 11px;border:1px solid var(--border);border-radius:2px;font-family:var(--font);font-size:.9em;background:var(--card);color:var(--text)}
.shop-add-in:focus{outline:none;border-color:var(--p2)}
.shop-add-act{display:flex;gap:8px}
.shop-add-save{flex:1;padding:9px;border:none;border-radius:2px;background:var(--p2);color:#fff;font-family:var(--font);font-weight:700;font-size:.86em;cursor:pointer}
.shop-add-save:hover{filter:brightness(1.06)}
.shop-add-cancel{padding:9px 16px;border:1px solid var(--border);border-radius:2px;background:none;color:var(--muted);font-family:var(--font);font-weight:600;font-size:.86em;cursor:pointer}
.shop-add-cancel:hover{color:var(--text)}
.shop-cam{margin-left:auto;flex:0 0 auto;align-self:center;width:30px;height:30px;border:1px solid var(--border);border-radius:2px;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.55;transition:.15s;padding:0}
.ck-row:hover .shop-cam{opacity:.8}
.shop-cam:hover{opacity:1;background:#efe9dc}
.shop-thumb{margin-left:auto;flex:0 0 auto;align-self:center;width:40px;height:40px;border:1px solid var(--border);border-radius:2px;background-size:cover;background-position:center;background-repeat:no-repeat;cursor:pointer;padding:0}
.shop-thumb:hover{border-color:var(--p2)}
.lightbox{position:fixed;inset:0;background:rgba(30,22,14,.85);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.lb-inner{max-width:94vw;max-height:92vh;display:flex;flex-direction:column;gap:14px;align-items:center}
.lb-inner img{max-width:94vw;max-height:76vh;border-radius:2px;box-shadow:0 12px 44px rgba(0,0,0,.5);object-fit:contain;background:#fff}
.lb-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lb-btn{padding:10px 20px;border:none;border-radius:2px;font-family:var(--font);font-weight:700;font-size:.9em;cursor:pointer;background:#fffdf8;color:var(--text)}
.lb-btn:hover{filter:brightness(.96)}
.lb-btn.lb-del{background:var(--red);color:#fff}
.lb-cap{color:#e8e2d6;font-size:.82em;text-align:center;max-width:640px;line-height:1.5}
.lb-cap a{color:#f0d98a;text-decoration:underline}
.img-credits{margin:8px 0 4px;font-size:.76em;color:var(--muted)}
.img-credits summary{cursor:pointer;font-weight:600;padding:6px 2px;list-style:none}
.img-credits summary::-webkit-details-marker{display:none}
.img-credits-b{padding:6px 4px 4px;line-height:1.7;color:#9a9081}
.img-credits-b a{color:var(--indigo);text-decoration:none}
/* Stats tab */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:2px;padding:14px;text-align:center}
.stat-label{font-size:.75em;color:var(--muted);margin-bottom:2px}
.stat-val{font-size:1.4em;font-weight:700}
.stat-val.red{color:var(--red)}
.stat-val.teal{color:var(--teal)}
.stat-val.indigo{color:var(--indigo)}
.stat-val.gold{color:var(--gold)}
.chart-wrap{position:relative;width:100%;height:300px;margin-bottom:24px}
.dist-tbl{width:100%;border-collapse:collapse;font-size:.8em}
.dist-tbl th{text-align:left;padding:8px 6px;font-weight:700;border-bottom:2px solid var(--border);color:var(--text)}
.dist-tbl th.r{text-align:right}
.dist-tbl td{padding:6px;border-bottom:.5px solid var(--border)}
.dist-tbl td.r{text-align:right}
.dist-tbl tr.warn td{font-weight:600}
.dist-tbl .km-hi{color:var(--red);font-weight:700}
.dist-tbl .km-mid{color:var(--gold);font-weight:600}
.dist-tbl .part-row td{background:var(--bg);font-weight:700;font-size:.85em;color:var(--muted);letter-spacing:.05em;padding:10px 6px}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;font-size:.78em;color:var(--muted);margin:10px 0 0}
.legend-row span{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:2px}
/* Formatted reservation details (apps list) */
.rx-section{font-weight:700;color:var(--text);margin:10px 0 4px;font-size:.9em;letter-spacing:.02em}
.rx-section:first-child{margin-top:4px}
.rx-item{padding:3px 0 3px 8px;border-left:2px solid var(--border);margin:3px 0 3px 4px;line-height:1.45}
/* Day navigation (Plan tab) */
.day-nav{position:sticky;top:0;z-index:10;display:flex;gap:5px;overflow-x:auto;padding:10px 2px;margin:0 0 10px;background:var(--bg);-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.day-nav::-webkit-scrollbar{display:none;height:0;width:0}
.day-nav a{flex:0 0 auto;font-size:.72em;font-weight:700;text-decoration:none;padding:4px 9px;border-radius:2px;border:1px solid transparent;transition:.15s}
.day-nav a:hover{transform:translateY(-1px);filter:brightness(.97)}
.dn-top{flex:0 0 auto;position:sticky;left:0;z-index:2;font-size:.78em;font-weight:700;padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-family:var(--font);transition:.15s;box-shadow:2px 0 6px rgba(0,0,0,.06)}
.dn-top:hover{color:var(--text);filter:brightness(.97)}
.dn-1{background:#f7e7e3;color:#8f2e20;border-color:#ecd2cb}
.dn-2{background:#e2f0eb;color:#115c4a;border-color:#cce3da}
.dn-3{background:#efe6f2;color:#5e3a6e;border-color:#e0d1e6}
.dn-4{background:#e7edf4;color:#2c456b;border-color:#d3dfea}
.dc{scroll-margin-top:54px}
/* Per-day kebab menu (kopiuj / podmień) */
.dmenu-btn{position:relative;flex:none;background:none;border:none;font-size:1.3em;line-height:1;color:var(--muted);cursor:pointer;padding:4px 10px;border-radius:2px;font-family:var(--font)}
.dmenu-btn:hover{background:#f1ebe0;color:var(--text)}
.dmenu-btn.dmenu-mod{color:var(--teal)}
.dmenu-btn.dmenu-mod::after{content:'';position:absolute;top:2px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--teal);border:1.5px solid var(--card)}
.dmenu-pop{display:none;position:fixed;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:2px;box-shadow:var(--shadow);overflow:hidden;min-width:150px}
.dmenu-pop button{display:block;width:100%;text-align:left;background:none;border:none;padding:11px 15px;font-size:.86em;font-family:var(--font);color:var(--text);cursor:pointer;white-space:nowrap}
.dmenu-pop button:hover{background:#f5f0e6}
.day-edit-ta{width:min(640px,90vw);min-height:280px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em;line-height:1.5;padding:12px;border:1px solid var(--border);border-radius:2px;box-sizing:border-box;resize:vertical;background:#fffdf8;color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#2a2723;color:#fff;padding:10px 18px;border-radius:8px;font-size:.85em;opacity:0;pointer-events:none;transition:.2s;z-index:200}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Opening-hours inline badge */
.hrs{color:var(--teal);font-weight:600}
/* Important info tab */
.info-grp{font-family:var(--font-jp);font-weight:700;font-size:.8em;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:24px 0 10px}
.info-grp:first-child{margin-top:0}
/* Ważne: płaskie arkusze „shiori" — wiersze na papierze zamiast pływających kart */
.info-sheet{background:var(--card);border:1px solid var(--border);border-radius:2px;margin-bottom:6px}
.info-sheet.alert{border-top:2px solid var(--red)}
.info-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 14px;padding:12px 16px}
.info-row+.info-row{border-top:1px solid var(--border)}
.info-row .irm{flex:1;min-width:220px}
.info-row .irl{font-weight:700;font-size:.95em}
.info-row .irx{font-size:.84em;color:var(--muted);line-height:1.55;margin-top:2px}
.info-row .iv{flex:none;font-variant-numeric:tabular-nums;font-size:.86em;font-weight:600;text-align:right;white-space:nowrap}
.info-row .iv .ivm{color:var(--muted);font-weight:400}
a.iv-tel{font-family:var(--font-serif);font-size:1.5em;font-weight:700;color:var(--red);text-decoration:none;letter-spacing:.02em;line-height:1}
a.iv-tel.sm{font-family:var(--font);font-size:1.05em;letter-spacing:0}
a.tel-inline{color:var(--red);font-weight:600;text-decoration:none;white-space:nowrap}
.ilist{margin:5px 0 0;padding-left:17px;font-size:.84em;color:var(--muted);line-height:1.55;display:flex;flex-direction:column;gap:4px}
.ilist li::marker{color:var(--red)}
.mchip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:2px;font-size:.92em;font-weight:600;color:var(--indigo);border:1px solid color-mix(in srgb,var(--indigo) 35%,transparent);background:color-mix(in srgb,var(--indigo) 7%,transparent);text-decoration:none;white-space:nowrap;transition:.15s;vertical-align:1px}
.mchip:hover{background:color-mix(in srgb,var(--indigo) 15%,transparent)}
.mchip svg{flex:none}
.info-note{display:flex;gap:13px;align-items:flex-start;border-top:1px solid var(--text);border-bottom:1px solid var(--text);padding:11px 4px;margin-bottom:20px;font-size:.82em;color:var(--muted);line-height:1.55}
.info-note .nseal{font-family:var(--font-serif);font-weight:700;font-size:.95em;color:var(--red);border:1.5px solid var(--red);border-radius:2px;padding:2px 8px;letter-spacing:.15em;flex:none;margin-top:1px}
.info-note.sync-note .nseal{color:var(--teal);border-color:var(--teal)}
.backup-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#p3 .ck-gt2,#p4 .ck-gt2,#p5 .ck-gt2,#p6 .ck-gt2,#pbud .ck-gt2{flex:0 1 auto;min-width:0}
#p3 .ck-grp::after,#p4 .ck-grp::after,#p5 .ck-grp::after,#p6 .ck-grp::after,#pbud .ck-grp::after{content:'';flex:1;min-width:20px;height:1px;background:var(--border)}
#p3 .ck-grp.mon-fill .ck-mon{background:var(--pc,var(--red));border-color:var(--pc,var(--red));color:var(--card)}
/* Pakowanie + Jedzenie + Zakupy: arkusze zamiast kart, keisen między wierszami, kwadratowe checkboxy */
#p4 .ck-gc2,#p5 .ck-gc2,#pbud .ck-gc2{order:1;background:none;border-radius:0;padding:0}
#p4 .ck-card,#p5 .ck-card,#pbud .ck-card{border-radius:2px;box-shadow:none;margin-bottom:6px}
#p4 .ck-items,#p5 .ck-items,#pbud .ck-items{padding:0}
#p4 .ck-row,#p5 .ck-row,#pbud .ck-row{border-radius:0;padding:10px 16px}
#p4 .ck-row+.ck-row,#p5 .ck-row+.ck-row,#pbud .ck-row+.ck-row{border-top:1px solid var(--border)}
#p4 .ck-cb,#p5 .ck-cb,#pbud .ck-cb{border-radius:2px;border-width:1.5px;width:18px;height:18px;font-size:12px}
#p4 .ck-bar,#p5 .ck-bar,#pbud .ck-bar,#p4 .ck-bar-f,#p5 .ck-bar-f,#pbud .ck-bar-f{border-radius:2px}
.ph-row{display:flex;align-items:center;gap:14px;padding:11px 16px}
.ph-row+.ph-row{border-top:1px solid var(--border)}
.ph-m{flex:1;min-width:0}
.ph-pl{font-size:.8em;color:var(--muted);margin-bottom:3px}
.ph-jp{font-family:var(--font-jp);font-size:1.22em;font-weight:500;color:var(--text);line-height:1.45}
.ph-rom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:.85em;color:var(--p3);font-style:italic}
.ph-pron{display:inline-block;font-size:.76em;color:#8a6d1f;background:#fdf6e7;border-radius:2px;padding:2px 9px;letter-spacing:.02em;font-style:normal}
.info-warn{background:#fff7ed;border:1px solid #f3d9b8;border-radius:2px;padding:11px 14px;font-size:.82em;color:#8a5a18;margin-bottom:18px;line-height:1.5}
.ival{font-weight:700;color:var(--text)}
.ibtn{font-family:var(--font);background:none;border:1px dashed var(--kin);color:var(--kin);cursor:pointer;font-size:.9em;padding:1px 7px;border-radius:2px;transition:.15s;white-space:nowrap}
.ibtn:hover{border-color:var(--teal);color:var(--teal);background:#f0faf8}
.ibtn-add{font-weight:600}
/* Nowe zakładki: checklisty, rozmówki, terminy */
.hdr-info-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:6px}
.cd-head{font-size:.9em;color:var(--teal);font-weight:700}
.tz-clock{font-size:.8em;font-weight:700;line-height:1.5;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:2px;padding:3px 11px;letter-spacing:.02em}
.tz-clock:empty{display:none}
.chk-on{opacity:.6}
.chk-on .chk-txt strong{text-decoration:line-through}
.chk-txt{font-size:.9em;line-height:1.45}
.pron{color:var(--teal);font-weight:700}
.cd-hero{background:var(--card);border:1px solid var(--border);border-top:2px solid var(--red);border-radius:2px;padding:20px;text-align:center;margin-bottom:10px}
.cd-big{font-family:var(--font-serif);font-size:2.4em;font-weight:700;color:var(--red);line-height:1.1}
.cd-unit{font-size:.4em;color:var(--muted);font-weight:500}
.cd-sub{font-size:.85em;color:var(--muted);margin-top:4px}
.cd-pill{display:inline-block;font-size:.7em;font-weight:700;padding:2px 8px;border-radius:12px;background:#e8e5de;color:var(--muted);vertical-align:middle}
.cd-pill.cd-soon{background:var(--gold);color:#fff}
.cd-pill.cd-past{background:#ece8e1;color:#b0a89c}
/* Print button */
.print-btn{font-family:var(--font);background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.82em;font-weight:600;padding:8px 16px;border-radius:2px;transition:.2s}
.print-btn:hover{border-color:var(--indigo);color:var(--indigo)}
/* Print / PDF */
@media print{
  body{padding:0;background:#fff;color:#000;font-size:11pt}
  .tabs,.day-nav,.noprint,.rc-actions,.link-btn,.link-rm,.chk-wrap,.print-btn,.ibtn,.day-collage,.img-credits,.dmenu-btn,.dmenu-pop,.toast,.tz-clock{display:none!important}
  .pnl{display:block!important;max-width:none;margin:0}

/* Ciekawostki (collapsible tips in plan) */
.tip-d{margin:6px 0 2px;border-left:2px dashed var(--kin);border-radius:0;background:#fdf6e7}
.tip-d[open]{background:#f9efd8}
.tip-s{cursor:pointer;padding:6px 11px;color:#9a7a25;font-weight:700;font-size:.84em;list-style:none;display:flex;align-items:center;gap:7px;user-select:none}
.tip-s::-webkit-details-marker{display:none}
.tip-s::marker{display:none;content:''}
.tip-s::after{content:'';margin-left:auto;flex:none;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--kin);transition:transform .2s}
.tip-d[open] .tip-s::after{transform:rotate(180deg)}
.tip-b{padding:3px 11px 9px 11px;font-size:.9em;color:var(--muted);line-height:1.6}
/* ── Warianty dnia (A/B) — przełącznik i opis kryteriów ── */

.vsel-btns{display:flex;flex-wrap:wrap;gap:6px;padding:8px 11px}
.vbtn{font:inherit;font-size:.8em;font-weight:700;cursor:pointer;padding:5px 11px;border-radius:2px;border:2px solid color-mix(in srgb,var(--indigo) 30%,transparent);background:var(--card);color:var(--indigo);transition:.15s}
.vbtn:hover{border-color:var(--indigo)}
.vbtn.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.vbtn b{font-family:var(--font-jp);margin-right:5px}
.vsel-d{font-size:.82em;line-height:1.55;color:var(--muted);padding:0 11px 10px}
.vsel-d b{color:var(--text)}
.vsel-c{margin-top:4px;color:var(--teal);font-weight:600}
.vbadge{display:inline-block;font-size:.72em;font-weight:700;font-family:var(--font-jp);background:color-mix(in srgb,var(--indigo) 12%,transparent);color:var(--indigo);border:1px solid color-mix(in srgb,var(--indigo) 30%,transparent);border-radius:2px;padding:0 5px;margin-right:6px;vertical-align:1px}
/* ── Tryb „TERAZ" — bieżący dzień i punkt planu ── */
.today-pill{display:inline-block;font-size:.62em;font-weight:700;background:var(--red);color:#fff;border-radius:12px;padding:2px 9px;margin-left:8px;vertical-align:middle;letter-spacing:.09em}
/* Minione punkty: wyszarzamy tylko godzinę i kropkę — opis zostaje w pełni czytelny,
   bo przy poślizgu w planie „już minięte" punkty wciąż się realizuje. */

@keyframes nowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

.now-pill .np-n{font-size:.68em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── Pogoda + słońce w nagłówku dnia ── */
.dwx{font-size:.72em;color:var(--muted);margin-top:3px;letter-spacing:.01em}

<script>
const TAB_NAMES=['plan','terminy','dystanse','zakupy','wazne','pakowanie','jedzenie','rozmowki'];
function sw(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));document.querySelectorAll('.pnl').forEach((p,j)=>p.classList.toggle('on',j===i));const np=document.getElementById('nowPill');if(np)np.style.display=(i===0&&np.dataset.has==='1')?'flex':'none'}
function selectTab(i){sw(i);try{history.replaceState(null,'','#'+TAB_NAMES[i])}catch(e){location.hash=TAB_NAMES[i]}}
function tabFromHash(){const h=decodeURIComponent(location.hash.slice(1));if(/^d\d+$/.test(h))return 0;const i=TAB_NAMES.indexOf(h);return i>=0?i:0}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function pc(t){const m=t.match(/Część\s*(\d+)/i);return m?m[1]:'1'}

// Sekcja TERMINY: jedna lista wpisów, każdy z własną datą. `kind` decyduje o szablonie —
// 'res' (4 pola, ma DX) dostaje checkbox + rozwijane szczegóły, 'evt' (3 pola) to samo
// wydarzenie na osi czasu bez checkboxa.
const PL_M=['','stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const PL_MN=['','Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
function resMonthLabel(mk){const p=mk.split('-');return PL_MN[+p[1]]+' '+p[0]+(D.meta.start&&mk>=D.meta.start.slice(0,7)?' — podróż':'')}
// Pilność wpisu: w trakcie podróży / do 30 dni / później
function resTier(sd){if(D.meta.start&&sd>=D.meta.start)return'rt-trip';return daysUntil(sd)<=30?'rt-now':'rt-soon'}
function fmtPlDate(sd){const p=sd.split('-');return (+p[2])+' '+PL_M[+p[1]]}

// ── Warianty dnia (A/B) ──
// Deklaracja w bloku dnia:  ? A* | Etykieta | Krótki opis | Kiedy wybrać
// (gwiazdka = wariant domyślny; linia „? " bez „ | " to nagłówek decyzji)
// Punkt harmonogramu należący do wariantu:  - A> 12:05 | Tytuł | Opis | Map query
function addVariant(cd,body){
  if(body.indexOf(' | ')<0){cd.vh=body;return}
  const p=body.split(' | '),raw=(p[0]||'').trim(),def=raw.endsWith('*');
  const k=(def?raw.slice(0,-1):raw).trim().toUpperCase();
  if(!k)return;
  cd.vr.push({k,lb:(p[1]||'').trim(),sh:(p[2]||'').trim(),cond:(p[3]||'').trim(),def});
}
function scPoint(body){
  const p=body.split(' | ');
  let tm=p[0]||'',v='';
  const m=tm.match(/^\s*([A-Z])>\s*/);
  if(m){v=m[1];tm=tm.slice(m[0].length)}

}
function newDay(head){const p=head.split(' | ');return{lb:p[0]||'',ds:p[1]||'',ts:p[2]||'',ht:p[3]||'',sm:'',sc:[],vr:[],vh:'',nt:[]}}
// Notka dnia: `> 🌡️ Etykieta | treść` (`>!` = akcja do wykonania, nie sama informacja)
function addNote(cd,body,act){
  const t=body.trim();if(!t)return;
  const m=/^(\p{Extended_Pictographic}️?)\s*/u.exec(t);
  const rest=m?t.slice(m[0].length):t,i=rest.indexOf(' | ');
  cd.nt.push({ic:m?m[1]:'',lb:i<0?'':rest.slice(0,i).trim(),tx:(i<0?rest:rest.slice(i+3)).trim(),act:!!act});
}

function tipKey(day,v,tm){return day+'_'+(v?v+'>':'')+tm}
function parse(text){
  const lines=text.split('\n'),meta={},items=[],parts=[],info=[],pack=[],food=[],shop=[],phrases=[],tips=[];
  let sec='',cp=null,cd=null,resCount=0;
  for(const raw of lines){
    const t=raw.trim();
    if(t.startsWith('### ')){sec=t.slice(4).trim();continue}
    if(sec==='META'){const m=t.match(/^(\w+):\s*(.+)$/);if(m)meta[m[1]]=m[2];continue}
    if(sec==='TERMINY'){
      if(!t||t.startsWith('#'))continue;
      const p=t.split(' | ');
      if(p.length<3)continue;
      const sd=p[0].trim(),ti=p[1].trim(),sub=p[2].trim();
      if(p.length>=4)items.push({kind:'res',i:resCount++,ti,sd,sub,dx:p[3].trim()});
      else items.push({kind:'evt',ti,sd,sub});
      continue;
    }
    if(sec==='WAZNE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');info.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim(),mq:(p[2]||'').trim()})}continue}
    if(sec==='PAKOWANIE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2)pack.push({grp:g[0].trim(),it:g[1].trim()});continue}
    if(sec==='JEDZENIE'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');const recs=(p[3]||'').trim()?p[3].split(';;').map(r=>{const a=r.split('@');return{nm:a[0].trim(),mq:(a[1]||a[0]).trim()}}).filter(r=>r.nm):[];food.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim(),mq:(p[2]||'').trim(),recs})}continue}
    if(sec==='ZAKUPY'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');shop.push({grp:g[0].trim(),lb:(p[0]||'').trim(),dt:(p[1]||'').trim(),wh:(p[2]||'').trim(),mq:(p[3]||'').trim()})}continue}
    if(sec==='ROZMOWKI'){if(!t||t.startsWith('#'))continue;const g=t.split(' :: ');if(g.length>=2){const p=g[1].split(' | ');phrases.push({grp:g[0].trim(),pl:(p[0]||'').trim(),jp:(p[1]||'').trim(),jpr:(p[2]||'').trim(),pron:(p[3]||'').trim()})}continue}
    if(sec==='CIEKAWOSTKI'){
      if(!t||t.startsWith('#'))continue;
      const p=t.split(' | ');
      if(p.length>=5){
        const dm=p[0].trim().match(/^D(\d+)$/);
        // Pole czasu może wskazywać kilka punktów naraz: „A>16:00; B>6:00"
        if(dm){const tm=p[1].trim();
          const keys=tm.split(';').map(x=>x.trim()).filter(Boolean).map(x=>{const vm=x.match(/^([A-Z])>\s*(.+)$/);return vm?{v:vm[1],tm:vm[2].trim()}:{v:'',tm:x}});
          tips.push({day:+dm[1],tm,keys,icon:p[2].trim(),ti:p[3].trim(),dx:p.slice(4).join(' | ').trim()});
        }
      }
      continue;
    }
    if(sec==='PLAN'){
      if(t.startsWith('# ')){cp={title:t.slice(2).trim(),days:[]};parts.push(cp);cd=null;continue}
      if(t.startsWith('== ')){cd=newDay(t.slice(3));if(cp)cp.days.push(cd);continue}
      if(t.startsWith('? ')&&cd){addVariant(cd,t.slice(2).trim());continue}
      if(t.startsWith('>! ')&&cd){addNote(cd,t.slice(3),true);continue}
      if(t.startsWith('> ')&&cd){addNote(cd,t.slice(2),false);continue}
      if(t.startsWith('- ')&&cd){cd.sc.push(scPoint(t.slice(2)));continue}
      if(t&&cd&&!t.startsWith('#')&&!t.startsWith('==')){cd.sm+=(cd.sm?' ':'')+t;continue}
    }
  }
  return{meta,items,parts,info,pack,food,shop,phrases,tips}
}

function fmtRx(s){
  let t=esc(s);

  t=t.replace(/▸\s*([^:]+):/g,'<div class="rx-section">▸ $1:</div>');
  // Numbered items: ① ② etc - each on its own line
  t=t.replace(/([①②③④⑤⑥⑦⑧⑨⑩⑪⑫])\s*/g,'<div class="rx-item">$1 ');
  // Close items (before next item or section or end)
  const parts=t.split('<div class="rx-item">');
  if(parts.length>1){
    t=parts[0];
    for(let i=1;i<parts.length;i++){t+='<div class="rx-item">'+parts[i]+'</div>';}
  }
  return t;
}

function parseDayBlock(text){

  text.split('\n').forEach(raw=>{
    const t=raw.trim();
    if(!t||t.startsWith('#'))return;
    if(t.startsWith('== ')){cd=newDay(t.slice(3));return}
    if(t.startsWith('? ')&&cd){addVariant(cd,t.slice(2).trim());return}
    if(t.startsWith('>! ')&&cd){addNote(cd,t.slice(3),true);return}
    if(t.startsWith('> ')&&cd){addNote(cd,t.slice(2),false);return}
    if(t.startsWith('- ')&&cd){cd.sc.push(scPoint(t.slice(2)));return}
    if(cd)cd.sm+=(cd.sm?' ':'')+t;
  });
  return cd;
}

}

function sunTimes(ds,lat,lon){

  const Jdate=new Date(ds+'T00:00:00Z').getTime()/86400000+2440587.5;
  const n=Math.round(Jdate-2451545.0+0.0008+lon/360);
  const Jstar=n-lon/360;
  const M=((357.5291+0.98560028*Jstar)%360+360)%360;
  const C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const L=((M+C+180+102.9372)%360+360)%360;
  const Jtransit=2451545.0+Jstar+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
  const sinD=Math.sin(L*rad)*Math.sin(23.4397*rad),cosD=Math.cos(Math.asin(sinD));

  const w=Math.acos(cosW)*deg;
  const f=j=>new Intl.DateTimeFormat('pl-PL',{timeZone:'Asia/Tokyo',hour:'numeric',minute:'2-digit'}).format(new Date((j-2440587.5)*86400000));
  return{rise:f(Jtransit-w/360),set:f(Jtransit+w/360)};
}

// ze świeżym cache w starym formacie czekają z odświeżeniem do wygaśnięcia TTL.
const WX_V=2,WX_H0=6,WX_HN=18;
const WX_UMB='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.4 8.3a6.6 6.6 0 0 1 13.2 0z" fill="currentColor"/><path d="M8 1.6V12.2a1.8 1.8 0 0 1-3.6 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
function wxHours(n){const wx=(getWxCache().d||{})[n];return(wx&&wx.hp&&wx.hp.length===WX_HN)?wx:null}
function wxLevel(p,mm){if(p>=70||mm>=2)return 2;if(p>=40)return 1;return 0}
function fmtMm(v){return(Math.round(v*10)/10).toFixed(1).replace('.',',')}
function hhmmToMin(t){const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'').trim());return m?+m[1]*60+ +m[2]:null}
function dayWxStrip(dnum){
  const n=+dnum,wx=dnum?wxHours(n):null;if(!wx)return'';
  if(Math.max.apply(null,wx.hp)<20&&Math.max.apply(null,wx.hm)<0.2)return'<div class="wxs dry noprint">☀️ Bez opadów w prognozie</div>';
  let bi=0;for(let i=1;i<WX_HN;i++)if((wx.hp[i]||0)>(wx.hp[bi]||0))bi=i;
  const rd=i=>{const p=Math.round(wx.hp[i]||0),mm=wx.hm[i]||0;return(WX_H0+i)+':00 · '+p+'%'+(mm>=0.1?' · '+fmtMm(mm)+' mm':' · bez opadów')};
  const def='szczyt '+rd(bi);
  let h='<div class="wxs noprint"><div class="wxs-bars" title="Prognoza godzinowa opadów 6:00–23:00 (Open-Meteo). Wysokość słupka = szansa opadów, ciemniejszy rdzeń = ilość mm/h. Dotknij paska (albo przeciągnij palcem), żeby zobaczyć wartości.">';
  for(let i=0;i<WX_HN;i++){
    const hr=WX_H0+i,p=Math.round(wx.hp[i]||0),mm=wx.hm[i]||0,lv=wxLevel(p,mm);
    const ph=p>0?Math.max(4,p):0,mh=mm>0?Math.min(ph,Math.max(4,Math.round(Math.min(100,mm/4*100)))):0;
    h+=`<div class="wxs-c" data-r="${esc(rd(i))}"><div class="wxs-b lv${lv}">`
      +(ph?`<i class="wxs-p" style="height:${ph}%"></i>`:'')
      +(mh?`<i class="wxs-m" style="height:${mh}%"></i>`:'')
      +`</div><span class="wxs-h">${hr%3===0?hr:''}</span></div>`;
  }
  return h+`</div><div class="wxs-out" data-def="${esc(def)}">${esc(def)}</div></div>`;
}
// Odczyt wartości pod paskiem: dotyk/przeciągnięcie na telefonie, hover przy myszy.
// Bez zaznaczenia pasek pokazuje szczyt dnia, więc linijka nigdy nie stoi pusta.
let wxDrag=null,wxHover=null;
function wxPick(bars,x){let best=null,bd=Infinity;
  for(const c of bars.children){const r=c.getBoundingClientRect(),d=Math.abs(x-(r.left+r.width/2));if(d<bd){bd=d;best=c}}
  return best;
}
function wxShow(bars,cell){
  if(!bars)return;
  const prev=bars.querySelector('.wxs-c.sel');if(prev)prev.classList.remove('sel');
  const out=bars.parentNode.querySelector('.wxs-out');if(!out)return;
  if(cell){cell.classList.add('sel');out.textContent=cell.dataset.r;out.classList.add('on')}
  else{out.textContent=out.dataset.def;out.classList.remove('on')}
}
function wxBarsAt(e){return e.target&&e.target.closest?e.target.closest('.wxs-bars'):null}
document.addEventListener('pointerdown',e=>{
  const bars=wxBarsAt(e);
  if(wxDrag&&wxDrag!==bars)wxShow(wxDrag,null);
  const sel=document.querySelector('.wxs-c.sel');
  if(sel&&sel.parentNode!==bars)wxShow(sel.parentNode,null);
  if(!bars)return;
  wxDrag=bars;wxShow(bars,wxPick(bars,e.clientX));
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(wxDrag){wxShow(wxDrag,wxPick(wxDrag,e.clientX));return}
  if(e.pointerType!=='mouse')return;
  const bars=wxBarsAt(e);
  if(bars!==wxHover){wxShow(wxHover,null);wxHover=bars}
  if(bars)wxShow(bars,wxPick(bars,e.clientX));
},{passive:true});
document.addEventListener('pointerup',()=>{wxDrag=null},{passive:true});
document.addEventListener('pointercancel',()=>{if(wxDrag)wxShow(wxDrag,null);wxDrag=null},{passive:true});
// Znacznik przy punkcie: maksimum z okna do następnego punktu (przycięte do 3 h)
function wxMark(dnum,tm,nextTm){
  const wx=dnum?wxHours(+dnum):null;if(!wx)return'';
  const s=hhmmToMin(tm);if(s===null)return'';
  let e=hhmmToMin(nextTm);
  if(e===null||e<=s)e=s+120;
  if(e>s+180)e=s+180;
  let bp=-1,bmm=0,bh=0;
  for(let hr=Math.floor(s/60);hr<=Math.ceil(e/60)-1;hr++){
    const i=hr-WX_H0;if(i<0||i>=WX_HN)continue;
    const p=Math.round(wx.hp[i]||0),mm=wx.hm[i]||0;
    if(p>bp||(p===bp&&mm>bmm)){bp=p;bmm=mm;bh=hr}
  }
  const lv=bp<0?0:wxLevel(bp,bmm);
  if(!lv)return'';
  return`<span class="stw lv${lv} noprint" title="szczyt ${bh}:00 · ${bp}%${bmm>=0.1?' · '+fmtMm(bmm)+' mm':''}">${WX_UMB}${bp}%${bmm>=0.5?'<i>'+fmtMm(bmm)+' mm</i>':''}</span>`;
}
// Notki dnia — wątki wyjęte z opisu: kontekst (kreska neutralna) i akcje do wykonania (kreska indygo)
function dayNotes(od){
  const ns=od.nt||[];if(!ns.length)return'';
  return'<div class="dnt">'+ns.map(n=>
    `<div class="dnt-i${n.act?' act':''}">${n.ic?`<span class="dnt-ic">${esc(n.ic)}</span>`:'<span class="dnt-ic"></span>'}`
    +`<div class="dnt-b">${n.lb?`<b>${esc(n.lb)}</b> `:''}${fmtNote(n.tx)}</div></div>`
  ).join('')+'</div>';
}
function dayMetaLine(dnum){
  const n=+dnum;const g=DAY_GEO[n];if(!g||!dnum)return'';
  const ds=dayDate(n);if(!ds)return'';
  const sun=sunTimes(ds,g[0],g[1]);
  let h=sun?`🌅 ${sun.rise} · 🌇 ${sun.set}`:'';
  const wx=(getWxCache().d||{})[n];
  const pp=(wx&&wx.pp!=null&&!wxHours(n))?' · ☔ '+Math.round(wx.pp)+'%':''; // przy pasku godzinowym dzienne % byłoby zdublowane
  if(wx&&wx.tx!=null)h+=`${h?' &nbsp;·&nbsp; ':''}🌡️ ${Math.round(wx.tx)}°/${Math.round(wx.tn)}°${pp}`;
  return h?`<div class="dwx" title="Wschód i zachód słońca (obliczane) · prognoza: Open-Meteo, odświeżana gdy jest internet">${h}</div>`:'';
}

// Kebab menu (kopiuj / podmień) per day
let dayMenuKey=null;
function ensureDayMenuPop(){
  let p=document.getElementById('dayMenuPop');
  if(!p){
    p=document.createElement('div');p.id='dayMenuPop';p.className='dmenu-pop';
    p.innerHTML='<button onclick="copyDayPlan(dayMenuKey)">📋 Kopiuj</button><button onclick="openReplaceModal(dayMenuKey)">✏️ Podmień</button>';
    document.body.appendChild(p);
  }
  return p;
}
function toggleDayMenu(e,key){
  e.stopPropagation();
  const p=ensureDayMenuPop();
  const alreadyOpen=p.style.display==='block'&&dayMenuKey===key;
  p.style.display='none';
  if(alreadyOpen){dayMenuKey=null;return}
  dayMenuKey=key;
  const r=e.currentTarget.getBoundingClientRect();
  p.style.display='block';
  const pw=p.offsetWidth;
  p.style.top=(r.bottom+4)+'px';
  p.style.left=Math.max(6,Math.min(r.right-pw,window.innerWidth-pw-6))+'px';
}
document.addEventListener('click',e=>{
  const p=document.getElementById('dayMenuPop');
  if(p&&p.style.display==='block'&&!p.contains(e.target)){p.style.display='none';dayMenuKey=null}
});
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800);
}
function currentDayText(key){
  const overrides=dayOverrides();
  if(overrides[key]!==undefined)return overrides[key];
  const orig=DAY_BY_KEY[key];
  return orig?dayText(orig):'';
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
}
function copyDayPlan(key){
  const p=document.getElementById('dayMenuPop');if(p)p.style.display='none';
  const txt=currentDayText(key);
  if(!txt)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Skopiowano dzień do schowka')).catch(()=>{fallbackCopy(txt);toast('Skopiowano dzień do schowka')});
  }else{fallbackCopy(txt);toast('Skopiowano dzień do schowka')}
}
function openReplaceModal(key){
  const p=document.getElementById('dayMenuPop');if(p)p.style.display='none';
  let ov=document.getElementById('dayEditModal');
  if(!ov){
    ov=document.createElement('div');ov.id='dayEditModal';ov.className='lightbox';
    document.body.appendChild(ov);
    ov.addEventListener('click',e=>{if(e.target===ov)closeReplaceModal()});
  }
  const overrides=dayOverrides();
  const hasOverride=overrides[key]!==undefined;
  const current=currentDayText(key);
  ov.innerHTML=`<div class="lb-inner"><div class="lb-cap" style="max-width:640px">Wklej pełny opis dnia w formacie z PLAN_DATA (nagłówek <code>==</code>, opis, punkty <code>-</code>).</div><textarea id="dayEditTa" class="day-edit-ta" spellcheck="false">${esc(current)}</textarea><div class="lb-actions"><button class="lb-btn" onclick="saveDayOverride('${key}')">💾 Zapisz</button>${hasOverride?`<button class="lb-btn lb-del" onclick="resetDayOverride('${key}')">↩️ Przywróć oryginał</button>`:''}<button class="lb-btn" onclick="closeReplaceModal()">Anuluj</button></div></div>`;
  ov.style.display='flex';
}
function closeReplaceModal(){const ov=document.getElementById('dayEditModal');if(ov)ov.style.display='none'}
function saveDayOverride(key){
  const ta=document.getElementById('dayEditTa');
  const txt=ta.value.trim();
  if(!txt||!parseDayBlock(txt)){alert('Nie udało się rozpoznać formatu dnia — sprawdź, czy zaczyna się od linii "== ..."');return}
  const o=dayOverrides();o[key]=txt;saveDayOverrides(o);
  closeReplaceModal();renderPlanTab();
}
function resetDayOverride(key){
  const o=dayOverrides();delete o[key];saveDayOverrides(o);
  closeReplaceModal();renderPlanTab();
}

  // y gridlines + labels
  [0,5,10,15,20].forEach(v=>{const yy=y(v);s+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="rgba(128,128,128,0.12)" stroke-width="1"/>`;s+=`<text x="${PL-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="#6b6b6b">${v}${v===20?' km':''}</text>`});

  [[15,'#E24B4A'],[12,'#EF9F27']].forEach(([v,c])=>{const yy=y(v);s+=`<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="${c}" stroke-width="1" stroke-dasharray="6 4"/>`});
  // bars + x labels

  return s+'</svg>';
}

function linkify(text){
  const re=/(https?:\/\/[^\s]+|www\.[^\s]+)/g;let out='',last=0,m;
  while((m=re.exec(text))){
    out+=esc(text.slice(last,m.index));
    let url=m[0],trail='';const tm=url.match(/[).,;!?]+$/);
    if(tm){trail=url.slice(url.length-tm[0].length);url=url.slice(0,url.length-tm[0].length);}
    const href=url.startsWith('www.')?'https://'+url:url;
    out+='<a class="mlink" href="'+esc(href)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(url)+'</a>'+esc(trail);
    last=m.index+m[0].length;
  }
  out+=esc(text.slice(last));return out;
}

function idbOpen(){return new Promise((res,rej)=>{if(IMG_DB)return res(IMG_DB);

  r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('img'))db.createObjectStore('img')};
  r.onsuccess=()=>{IMG_DB=r.result;res(IMG_DB)};r.onerror=()=>rej(r.error);});}
function idbStore(mode){return idbOpen().then(db=>db.transaction('img',mode).objectStore('img'))}
function idbReq(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function idbPut(key,blob){return idbStore('readwrite').then(st=>idbReq(st.put(blob,key)))}

function readImageBlob(file,cb){
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();img.onload=()=>{
    const MAX=1000;let w=img.width,h=img.height;
    if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r)}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    c.toBlob(b=>cb(b),'image/jpeg',0.72);
  };img.onerror=()=>alert('Nie udało się wczytać zdjęcia.');img.src=e.target.result;};
  rd.readAsDataURL(file);
}

// ── Eksport / import (kopia zapasowa, Ważne / Terminy / Zakupy jako osobne pliki) ──
function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}
function dataURLToBlob(durl){return fetch(durl).then(r=>r.blob())}
async function collectPhotos(keyFilter){
  const m=await idbAll().catch(()=>({}));const out={};
  for(const k of Object.keys(m)){if(m[k]&&keyFilter(k))out[k]=await blobToDataURL(m[k])}
  return out;
}
async function putPhotos(photos){
  for(const k of Object.keys(photos||{})){
    const blob=await dataURLToBlob(photos[k]);
    await idbPut(k,blob);
    if(IMG_URLS[k])URL.revokeObjectURL(IMG_URLS[k]);
    IMG_URLS[k]=URL.createObjectURL(blob);
  }
}
function todayStamp(){return new Date().toISOString().slice(0,10)}
function downloadFile(name,text){
  const blob=new Blob([text],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function shareOrDownload(name,text){
  try{
    const file=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  downloadFile(name,text);
}
async function exportWazne(){
  const data={type:'jp27-wazne',v:1,exportedAt:new Date().toISOString(),info:getInfoState()};
  await shareOrDownload(`japonia2027-wazne-${todayStamp()}.json`,JSON.stringify(data));
  toast('Wyeksportowano: Ważne');
}
async function exportTerminy(){
  const photos=await collectPhotos(k=>k.startsWith('res-'));
  const data={type:'jp27-terminy',v:1,exportedAt:new Date().toISOString(),res:getResState(),photos};
  await shareOrDownload(`japonia2027-terminy-${todayStamp()}.json`,JSON.stringify(data));
  const n=Object.keys(photos).length;
  toast('Wyeksportowano: Terminy'+(n?` (${n} zdj.)`:''));
}
async function exportZakupy(){
  const photos=await collectPhotos(k=>!k.startsWith('res-'));
  const data={type:'jp27-zakupy',v:1,exportedAt:new Date().toISOString(),chk:getChk('jp27_shop'),custom:getCustom(),photos};
  await shareOrDownload(`japonia2027-zakupy-${todayStamp()}.json`,JSON.stringify(data));

function pickImportFiles(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';inp.multiple=true;
  inp.onchange=()=>{if(inp.files&&inp.files.length)importFiles(inp.files)};
  inp.click();
}
async function importOne(file){
  let data;
  try{data=JSON.parse(await file.text())}catch(e){return{ok:false,label:file.name+': nieprawidłowy plik'}}
  if(data.type==='jp27-wazne'){
    saveInfoState(data.info||{});renderInfo();
    return{ok:true,label:'Ważne'};
  }
  if(data.type==='jp27-terminy'){
    saveResState(data.res||{});
    await putPhotos(data.photos);
    renderAllRes();
    const n=Object.keys(data.photos||{}).length;
    return{ok:true,label:'Terminy'+(n?` (${n} zdj.)`:'')};
  }
  if(data.type==='jp27-zakupy'){
    saveChk('jp27_shop',data.chk||{});saveCustom(data.custom||{});
    await putPhotos(data.photos);
    renderShopping();
    const n=Object.keys(data.photos||{}).length;
    return{ok:true,label:'Zakupy'+(n?` (${n} zdj.)`:'')};
  }
  return{ok:false,label:file.name+': nieznany typ pliku'};
}
async function importFiles(fileList){
  const results=[];
  for(const f of Array.from(fileList))results.push(await importOne(f));
  const ok=results.filter(r=>r.ok).map(r=>r.label),bad=results.filter(r=>!r.ok).map(r=>r.label);
  let msg=ok.length?`Zaimportowano: ${ok.join(', ')}`:'';
  if(bad.length)msg+=(msg?' — ':'')+`błąd: ${bad.join(', ')}`;
  toast(msg||'Nic nie zaimportowano');
}

// Zegar: pokazuje czas w Tokio (dla urządzeń spoza Japonii) albo w Polsce (dla urządzeń w japońskiej strefie)
function renderTzClock(){
  const el=document.getElementById('tzClock');
  if(!el)return;
  const now=new Date();
  const localTz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  const isJapanDevice=localTz==='Asia/Tokyo'||(-now.getTimezoneOffset())===540;
  const targetTz=isJapanDevice?'Europe/Warsaw':'Asia/Tokyo';
  const flag=isJapanDevice?'🇵🇱':'🇯🇵';
  const time=new Intl.DateTimeFormat('pl-PL',{timeZone:targetTz,hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
  const targetDate=new Intl.DateTimeFormat('pl-PL',{timeZone:targetTz,day:'2-digit',month:'2-digit'}).format(now);
  const localDate=new Intl.DateTimeFormat('pl-PL',{day:'2-digit',month:'2-digit'}).format(now);
  el.textContent=flag+' '+time+(targetDate===localDate?'':' · '+targetDate);
  el.title=(isJapanDevice?'Aktualny czas w Polsce':'Aktualny czas w Tokio')+(targetDate===localDate?'':' (inny dzień niż lokalnie)');
}

// Dzień N podróży = start (D.meta.start, dzień 0) + N dni; daty liczone wg strefy Japonii.
// Dzień 0 (wylot z PL) i „Powrót" mają godziny polskie — dla nich zegar liczy się wg Warszawy.
function tripDayNum(){
  if(!D.meta.start)return null;
  const jp=tzParts('Asia/Tokyo'),pl=tzParts('Europe/Warsaw');if(!jp||!pl)return null;
  const d0=new Date(dayDate(0)+'T00:00:00Z');
  const num=p=>Math.round((new Date(p.d+'T00:00:00Z')-d0)/86400000);
  // Dzień 0 i HOME_DAY rozgrywają się na zegarze polskim — dla nich granica doby też jest warszawska,
  // inaczej dzień wylotu „zaczyna się" 7 h za wcześnie (w Tokio jest już jutro).
  const nPl=num(pl);if(nPl===0||nPl===HOME_DAY)return nPl;
  const nJp=num(jp);return(nJp>=1&&nJp<=LAST_JP_DAY)?nJp:null;
}
function ensureNowPill(){
  let p=document.getElementById('nowPill');
  if(!p){
    p=document.createElement('div');p.id='nowPill';p.className='now-pill noprint';
    p.innerHTML='<span class="np-k">▶ TERAZ</span><span class="np-body"><span class="np-t"></span><span class="np-n"></span></span>';
    p.onclick=()=>{if(p._target){p._target.scrollIntoView({block:'center',behavior:'smooth'})}};
    document.body.appendChild(p);
  }
  return p;
}
function updateNowMode(){
  document.querySelectorAll('.sr-now,.sr-past').forEach(el=>el.classList.remove('sr-now','sr-past'));
  document.querySelectorAll('.today-pill').forEach(el=>el.remove());
  const pill=ensureNowPill();
  const n=tripDayNum();
  const off=()=>{pill.dataset.has='0';pill.style.display='none'};
  if(n===null){off();return}
  const dc=document.getElementById(n===HOME_DAY?'dhome':'d'+n);
  if(!dc){off();return}
  const dn=dc.querySelector('.dh .dn');
  if(dn){const sp=document.createElement('span');sp.className='today-pill';sp.textContent='DZIŚ';dn.appendChild(sp)}
  const cur=tzParts((n===0||n===HOME_DAY)?'Europe/Warsaw':'Asia/Tokyo');
  if(!cur){off();return}
  const rows=[...dc.querySelectorAll('.sr')].map(el=>{const m=(el.dataset.tm||'').match(/^(\d{1,2}):(\d{2})/);return m?{el,min:+m[1]*60+ +m[2]}:null}).filter(Boolean);
  let curRow=null,nextRow=null;
  rows.forEach(r=>{if(r.min<=cur.min)curRow=r;else if(!nextRow)nextRow=r});
  rows.forEach(r=>{if(curRow&&r.min<curRow.min)r.el.classList.add('sr-past')});
  if(curRow)curRow.el.classList.add('sr-now');
  const titleOf=r=>{const s=r.el.querySelector('.sc strong');return s?s.textContent.trim():''};
  pill.querySelector('.np-t').textContent=curRow?(curRow.el.dataset.tm+' · '+titleOf(curRow)):('Dzień '+(n===HOME_DAY?'powrotu':n)+' — plan startuje o '+(rows[0]?rows[0].el.dataset.tm:'?'));
  let nt='';
  if(nextRow){const df=nextRow.min-cur.min,hh=Math.floor(df/60),mm=df%60;nt='za '+(hh?hh+' h ':'')+(mm||!hh?mm+' min':'')+' → '+titleOf(nextRow)}
  const npn=pill.querySelector('.np-n');npn.textContent=nt;npn.style.display=nt?'':'none';
  pill._target=curRow?curRow.el:dc;
  pill.dataset.has='1';
  pill.style.display=document.getElementById('p1').classList.contains('on')?'flex':'none';
}
setInterval(updateNowMode,60000);
// Auto-przewinięcie do dzisiejszego dnia przy starcie (tylko w trakcie podróży, bez własnej kotwicy w URL)
(function(){
  const n=tripDayNum();if(n===null)return;
  const h=location.hash;if(h&&h!=='#plan')return;
  const el=document.getElementById(n===HOME_DAY?'dhome':'d'+n);
  if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),200);
})();

// ── Pogoda: Open-Meteo (bez klucza), jedno zapytanie o wszystkie lokalizacje, cache 3h ──
function fetchWx(){
  if(!navigator.onLine)return;
  const c=getWxCache();
  if(c.ts&&c.v===WX_V&&Date.now()-c.ts<3*3600*1000)return; // cache w starym formacie = odśwież od razu, nie czekaj na TTL
  if(!D.meta.start)return;
  const jp=tzParts('Asia/Tokyo');if(!jp)return;
  const addD=(ds,k)=>{const t=new Date(ds+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+k);return t.toISOString().slice(0,10)};
  const start=dayDate(1)>jp.d?dayDate(1):jp.d;
  const horizon=addD(jp.d,15);
  const end=dayDate(LAST_JP_DAY)<horizon?dayDate(LAST_JP_DAY):horizon;
  if(start>end)return; // poza 16-dniowym horyzontem prognozy albo po podróży
  const coords=[],idx={};
  for(let n=1;n<=LAST_JP_DAY;n++){const g=DAY_GEO[n];if(!g)continue;const k=g.join(',');if(!(k in idx)){idx[k]=coords.length;coords.push(g)}}
  const url='https://api.open-meteo.com/v1/forecast?latitude='+coords.map(c=>c[0]).join(',')+'&longitude='+coords.map(c=>c[1]).join(',')+'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=precipitation_probability,precipitation&timezone=Asia%2FTokyo&start_date='+start+'&end_date='+end;
  fetch(url).then(r=>r.json()).then(j=>{
    const arr=Array.isArray(j)?j:[j];
    const byDay={};
    for(let n=1;n<=LAST_JP_DAY;n++){
      const g=DAY_GEO[n];if(!g)continue;
      const loc=arr[idx[g.join(',')]];
      if(!loc||!loc.daily||!loc.daily.time)continue;
      const ds=dayDate(n);
      const di=loc.daily.time.indexOf(ds);
      if(di<0)continue;
      const rec={tx:loc.daily.temperature_2m_max[di],tn:loc.daily.temperature_2m_min[di],pp:loc.daily.precipitation_probability_max[di]};
      // godzinowe 6:00–23:00 tylko dla daty tego dnia — do cache trafia sam wycinek, nie cała odpowiedź
      const ht=loc.hourly&&loc.hourly.time;
      if(ht){
        const hp=[],hm=[];let found=false;
        for(let k=0;k<WX_HN;k++){
          const hi=ht.indexOf(ds+'T'+String(WX_H0+k).padStart(2,'0')+':00');
          if(hi>=0)found=true;
          hp.push(hi<0?0:Math.round(loc.hourly.precipitation_probability[hi]||0));
          hm.push(hi<0?0:Math.round((loc.hourly.precipitation[hi]||0)*10)/10);
        }
        if(found){rec.hp=hp;rec.hm=hm}
      }
      byDay[n]=rec;
    }
    if(Object.keys(byDay).length){
      try{localStorage.setItem('jp27_wx',JSON.stringify({v:WX_V,ts:Date.now(),d:byDay}))}catch(e){}
      renderPlanTab();
    }
  }).catch(()=>{});
}
fetchWx();
setInterval(fetchWx,30*60*1000);

// PWA: rejestracja service workera (tryb offline + instalacja na telefonie)
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
